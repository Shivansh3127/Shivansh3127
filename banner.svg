<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Shivansh Agarwal - Software Developer, Backend, Cloud and DevOps" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050A1A"/>
      <stop offset="0.55" stop-color="#0A1F4D"/>
      <stop offset="1" stop-color="#0B5CAD"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.6" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="wave1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#0B5CAD" stop-opacity="0.1"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#fff" opacity="0.07"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="round"><rect width="1200" height="320" rx="18"/></clipPath>
    <clipPath id="typeClip">
      <rect x="380" y="218" height="26" width="0">
        <animate attributeName="width" values="0;300;300;0" keyTimes="0;0.45;0.9;1" dur="7s" begin="1.5s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <g clip-path="url(#round)" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#dots)"/>
    <circle cx="1030" cy="150" r="190" fill="url(#glow)"/>

    <!-- floating particles -->
    <g fill="#7DD3FC">
      <circle cx="340" cy="290" r="2" opacity="0.5"><animate attributeName="cy" values="300;20" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.6;0" dur="9s" repeatCount="indefinite"/></circle>
      <circle cx="560" cy="300" r="1.6" opacity="0.5"><animate attributeName="cy" values="310;30" dur="11s" begin="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.6;0" dur="11s" begin="2s" repeatCount="indefinite"/></circle>
      <circle cx="760" cy="300" r="2.2" opacity="0.5"><animate attributeName="cy" values="310;10" dur="10s" begin="1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.6;0" dur="10s" begin="1s" repeatCount="indefinite"/></circle>
      <circle cx="900" cy="300" r="1.5" opacity="0.5"><animate attributeName="cy" values="310;40" dur="12s" begin="4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.6;0" dur="12s" begin="4s" repeatCount="indefinite"/></circle>
      <circle cx="180" cy="300" r="1.8" opacity="0.5"><animate attributeName="cy" values="310;50" dur="13s" begin="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.6;0" dur="13s" begin="3s" repeatCount="indefinite"/></circle>
    </g>

    <!-- code window (left) -->
    <g>
      <rect x="40" y="70" width="270" height="170" rx="12" fill="#0B1226" fill-opacity="0.75" stroke="#38BDF8" stroke-opacity="0.35"/>
      <circle cx="60" cy="90" r="4" fill="#F87171"/>
      <circle cx="75" cy="90" r="4" fill="#FBBF24"/>
      <circle cx="90" cy="90" r="4" fill="#34D399"/>
      <line x1="40" y1="106" x2="310" y2="106" stroke="#38BDF8" stroke-opacity="0.2"/>
      <rect x="62" y="124" height="8" rx="4" fill="#38BDF8"><animate attributeName="width" values="0;90;90;0" keyTimes="0;0.25;0.9;1" dur="8s" repeatCount="indefinite"/></rect>
      <rect x="80" y="146" height="8" rx="4" fill="#94A3B8"><animate attributeName="width" values="0;140;140;0" keyTimes="0;0.25;0.9;1" dur="8s" begin="0.5s" repeatCount="indefinite"/></rect>
      <rect x="80" y="168" height="8" rx="4" fill="#22D3EE"><animate attributeName="width" values="0;110;110;0" keyTimes="0;0.25;0.9;1" dur="8s" begin="1s" repeatCount="indefinite"/></rect>
      <rect x="62" y="190" height="8" rx="4" fill="#818CF8"><animate attributeName="width" values="0;70;70;0" keyTimes="0;0.25;0.9;1" dur="8s" begin="1.5s" repeatCount="indefinite"/></rect>
      <rect x="80" y="212" height="8" rx="4" fill="#94A3B8"><animate attributeName="width" values="0;120;120;0" keyTimes="0;0.25;0.9;1" dur="8s" begin="2s" repeatCount="indefinite"/></rect>
      <rect x="205" y="212" width="8" height="12" fill="#22D3EE"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>
    </g>

    <!-- name + role -->
    <g>
      <text x="380" y="140" font-size="54" font-weight="800" letter-spacing="0.5" fill="#FFFFFF">Shivansh <tspan fill="url(#accent)">Agarwal</tspan>
        <animate attributeName="opacity" from="0" to="1" dur="1s" fill="freeze"/>
        <animateTransform attributeName="transform" type="translate" from="-24 0" to="0 0" dur="1s" fill="freeze"/>
      </text>
      <text x="381" y="182" font-size="22" font-weight="500" fill="#CBD5E1" opacity="0">Software Developer  |  Backend  |  Cloud &amp; DevOps
        <animate attributeName="opacity" from="0" to="1" dur="1s" begin="0.8s" fill="freeze"/>
      </text>
      <rect x="381" y="196" width="0" height="3" rx="1.5" fill="url(#accent)">
        <animate attributeName="width" from="0" to="120" dur="1s" begin="1.2s" fill="freeze"/>
      </rect>
      <g clip-path="url(#typeClip)">
        <text x="380" y="237" font-family="'Cascadia Code', Consolas, 'Courier New', monospace" font-size="16" fill="#7DD3FC">&gt; building scalable systems</text>
      </g>
      <rect y="221" width="8" height="18" fill="#22D3EE">
        <animate attributeName="x" values="380;680;680;380" keyTimes="0;0.45;0.9;1" dur="7s" begin="1.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- orbit + pipeline (right) -->
    <g>
      <circle cx="1030" cy="150" r="108" fill="none" stroke="#38BDF8" stroke-opacity="0.45" stroke-width="1.5" stroke-dasharray="3 9" stroke-linecap="round">
        <animateTransform attributeName="transform" type="rotate" from="0 1030 150" to="360 1030 150" dur="40s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1030" cy="150" r="72" fill="none" stroke="#818CF8" stroke-opacity="0.5" stroke-width="1.5" stroke-dasharray="14 10">
        <animateTransform attributeName="transform" type="rotate" from="360 1030 150" to="0 1030 150" dur="28s" repeatCount="indefinite"/>
      </circle>
      <!-- orbiting dot -->
      <g>
        <circle cx="1138" cy="150" r="5" fill="#22D3EE"/>
        <animateTransform attributeName="transform" type="rotate" from="0 1030 150" to="360 1030 150" dur="12s" repeatCount="indefinite"/>
      </g>

      <!-- helm-wheel core -->
      <g transform="translate(1030 150)">
        <polygon points="0,-40 34.6,-20 34.6,20 0,40 -34.6,20 -34.6,-20" fill="#0B1226" fill-opacity="0.85" stroke="#38BDF8" stroke-width="2"/>
        <g stroke="#7DD3FC" stroke-width="2.5" stroke-linecap="round" fill="none">
          <circle r="14"/>
          <g>
            <line x1="0" y1="-14" x2="0" y2="-26"/><line x1="0" y1="14" x2="0" y2="26"/>
            <line x1="-14" y1="0" x2="-26" y2="0"/><line x1="14" y1="0" x2="26" y2="0"/>
            <line x1="-10" y1="-10" x2="-18" y2="-18"/><line x1="10" y1="10" x2="18" y2="18"/>
            <line x1="10" y1="-10" x2="18" y2="-18"/><line x1="-10" y1="10" x2="-18" y2="18"/>
            <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/>
          </g>
        </g>
        <circle r="4" fill="#22D3EE"/>
      </g>

      <!-- floating tech pills -->
      <g>
        <g transform="translate(1086 62)"><rect width="78" height="28" rx="14" fill="#0B1226" fill-opacity="0.85" stroke="#38BDF8" stroke-opacity="0.6"/><text x="39" y="19" font-size="13" font-weight="600" fill="#E0F2FE" text-anchor="middle">Docker</text>
          <animateTransform attributeName="transform" type="translate" values="1086 62;1086 55;1086 62" dur="4s" repeatCount="indefinite"/></g>
        <g transform="translate(1100 222)"><rect width="62" height="28" rx="14" fill="#0B1226" fill-opacity="0.85" stroke="#FBBF24" stroke-opacity="0.7"/><text x="31" y="19" font-size="13" font-weight="600" fill="#FEF3C7" text-anchor="middle">AWS</text>
          <animateTransform attributeName="transform" type="translate" values="1100 222;1100 229;1100 222" dur="5s" repeatCount="indefinite"/></g>
        <g transform="translate(920 40)"><rect width="76" height="28" rx="14" fill="#0B1226" fill-opacity="0.85" stroke="#818CF8" stroke-opacity="0.7"/><text x="38" y="19" font-size="13" font-weight="600" fill="#E0E7FF" text-anchor="middle">CI/CD</text>
          <animateTransform attributeName="transform" type="translate" values="920 40;920 47;920 40" dur="4.5s" repeatCount="indefinite"/></g>
        <g transform="translate(905 232)"><rect width="84" height="28" rx="14" fill="#0B1226" fill-opacity="0.85" stroke="#34D399" stroke-opacity="0.7"/><text x="42" y="19" font-size="13" font-weight="600" fill="#D1FAE5" text-anchor="middle">Backend</text>
          <animateTransform attributeName="transform" type="translate" values="905 232;905 225;905 232" dur="5.5s" repeatCount="indefinite"/></g>
      </g>
    </g>

    <!-- waves -->
    <path d="M0 292 q100 -34 200 0 t200 0 t200 0 t200 0 t200 0 t200 0 t200 0 t200 0 V330 H0 Z" fill="url(#wave1)">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-400 0" dur="9s" repeatCount="indefinite"/>
    </path>
    <path d="M-200 300 q100 -26 200 0 t200 0 t200 0 t200 0 t200 0 t200 0 t200 0 t200 0 t200 0 V330 H-200 Z" fill="#38BDF8" fill-opacity="0.18">
      <animateTransform attributeName="transform" type="translate" from="-400 0" to="0 0" dur="13s" repeatCount="indefinite"/>
    </path>

    <!-- light sweep -->
    <rect x="-300" y="0" width="300" height="320" fill="url(#shine)">
      <animate attributeName="x" from="-300" to="1500" dur="7s" begin="2s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
